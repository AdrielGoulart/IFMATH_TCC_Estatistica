<section class="ifmath-form__contener__body">
  <!-- Form -->
  <form (ngSubmit)="onSubmit()" [formGroup]="form" #demoForm="ngForm">
      <div class="row ifmath-conteudo__titulo">
          <span class="ifmath-conteudo__txt-titulo"><br>
              <h3>Multiplicacao de dois números inteiros</h3>
          </span>
      </div>
      <div class="row">
          <!-- Title -->
          <div class="col-sm-12 col-md-4 ifmath-form__title ifmath-conteudo__borda">
              <img class="ifmath-form_img-formula ifmath-form_img-formula--blackgrey"
                  src="assets/images/formulas/formula_NeO_multiplicacao.png"><br />
              <br />
          </div>

          <div class="col-sm-12 col-md-8">
              <!-- Fields -->
              <div class="col-md-12 input-group">
                  <span class="input-group-addon input-group-addon--blackgrey" id="sizing-addon2">a</span>
                  <input type="text" name="a" formControlName="a" class="form-control"
                      aria-describedby="sizing-addon2">
              </div>
              <div>
                      <span class="ifmath-form__label ifmath-form__label--error"
                          *ngIf="form.get('a').hasError('required') && form.get('a').touched">Campo
                          invalido!</span>
                  </div>
                  <br>
              
              <div class="col-md-12 input-group">
                  <span class="input-group-addon input-group-addon--blackgrey" id="sizing-addon2">b</span>
                  <input type="text" name="b" formControlName="b" class="form-control"
                      aria-describedby="sizing-addon2">
              </div>
              <div>
                  <span class="ifmath-form__label ifmath-form__label--error"
                      *ngIf="form.get('b').hasError('required') && form.get('b').touched">Campo
                      invalido!</span>
              </div>
              <br>

              <!-- buttons -->
              <div class="col-sm-12 col-md-12 ifmath-form__button__group">
                  <button type="submit" class="btn btn-success btn-success--blackgrey btn-success--semMargin"
                      [disabled]='form.invalid' value="Calcular">Calcular</button>
                  <button type="reset" class="btn btn-success btn-success--blackgrey btn-success--semMargin"
                      value="Limpar">Limpar</button>
              </div>
          </div>
      </div>

  </form>
  <!-- endregion -->
  <div class="row">
      <!-- region Resultados -->
      <div class="col-sm-12 col-md-12">
        <li class="aresults results__item" *ngFor="let resultado of resultados; let i = index">
            <div class="results__item__icon">
                <div [attr.data-target]="'#resultado'+i" data-toggle="collapse">
                <div *ngIf="'#resultado'+i; else elseBlock">
                  <i class="showbutton fa fa-arrow-circle-down results__item__icon__fa__down" aria-hidden="true"></i>
                </div>
                <ng-template #elseBlock>
                  <i class="showbutton fa fa-arrow-circle-down results__item__icon__fa__up" aria-hidden="true"></i>
                </ng-template>
                </div>
            </div>
            <div class="expression" [innerHtml] = "expression[i]"></div>
            <div id="{{'resultado'+i}}" class="desc collapse results__item__text">
                <div class = "desctext" [innerHtml] = "desc[i]"> </div>
                <a class = "link" *ngIf = "i==1" [routerLink]="['/numeros_operacoes/numeros_naturais/nn_multiplicacao']" [queryParams]= "{a: numbera, b: numberb}">O processo de multiplicação pode ser visto aqui</a>
            </div>
        </li>
          
      </div>
      <!-- endregion -->
  </div>
</section>

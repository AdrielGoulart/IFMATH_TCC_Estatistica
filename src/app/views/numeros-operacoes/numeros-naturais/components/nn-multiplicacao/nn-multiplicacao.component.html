<!-- region formulario -->
<section class="ifmath-form__contener__body">
    <!-- Form -->
    <form (ngSubmit)="onSubmit()" [formGroup]="form" #demoForm="ngForm">
        <div class="row ifmath-conteudo__titulo">
            
            <span class="ifmath-conteudo__txt-titulo"><br>
                <h3>Multiplicação de dois números naturais:</h3>
            </span>
        </div>
        <div class="row">
            <!-- Title -->
            <div class="col-sm-12 col-md-4 ifmath-form__title ifmath-conteudo__borda">
                <img class="ifmath-form_img-formula ifmath-form_img-formula--blackgrey"
                    src="assets/images/formulas/formula_NeO_multiplicacao.png"><br />
                <br />
            </div>

            <div class="col-sm-12 col-md-8">
                <!-- Fields -->
                <div class="col-md-12 input-group">
                    <span class="input-group-addon input-group-addon--blackgrey" id="sizing-addon2">a</span>
                    <input type="text" name="a" formControlName="a" class="form-control"
                        aria-describedby="sizing-addon2">
                </div>
                <div>
                    <span class="ifmath-form__label ifmath-form__label--error"
                        *ngIf="form.get('a').hasError('required') && form.get('a').touched">Campo
                        invalido!</span>
                </div>
                <br>
                <div class="col-md-12 input-group">
                    <span class="input-group-addon input-group-addon--blackgrey" id="sizing-addon2">b</span>
                    <input type="text" name="b" formControlName="b" class="form-control"
                        aria-describedby="sizing-addon2">
                </div>
                <div>
                    <span class="ifmath-form__label ifmath-form__label--error"
                        *ngIf="form.get('b').hasError('required') && form.get('b').touched">Campo
                        invalido!</span>
                </div>
                <br>

                <!-- buttons -->
                <div class="col-sm-12 col-md-12 ifmath-form__button__group">
                    <button type="submit" class="btn btn-success btn-success--blackgrey btn-success--semMargin"
                        [disabled]='form.invalid' value="Calcular">Calcular</button>
                    <button type="reset" class="btn btn-success btn-success--blackgrey btn-success--semMargin"
                        value="Limpar">Limpar</button>
                </div>
            </div>
        </div>

    </form>
    <!-- endregion -->
    <div class="row">
         <!-- region Resultados -->
         <div class="col-sm-12 col-md-12">
            <div *ngIf="showall">
            <section class="row results">
              <div *ngIf="loading" class="col-sm-12">
                <ifmath-ng-loading-spinner></ifmath-ng-loading-spinner>
              </div> 
                <div *ngIf="!loading" class="col-sm-12">
                    <li class="mresults results__item" *ngFor="let resultado of resultados; let i = index">
                        <div [attr.data-target]="'#resultado'+i" data-toggle="collapse">
                          <div class="results__item__icon">
                            <div *ngIf="'#resultado'+i; else elseBlock">
                              <i class="showbutton fa fa-arrow-circle-down results__item__icon__fa__down" aria-hidden="true"></i>
                            </div>
                            <ng-template #elseBlock>
                              <i class="showbutton fa fa-arrow-circle-down results__item__icon__fa__up" aria-hidden="true"></i>
                            </ng-template>
                          </div>
                          <div id="{{'operacao'+i}}" *ngIf = "!(resultados.length-1==i)"> 
                            <div class="multoperation">
                              <div class="leftovers" [innerHTML] = "leftovers1[i]" *ngIf="leftovers1[i]!==undefined">
                  
                              </div>
                              <div class="topnumber" [innerHTML] ="topnumber[i]" *ngIf="topnumber[i]!==undefined && sumresult[i]=='-'">
                                
                              </div>
                              <div class="bottomnumber" [innerHTML] = "bottomnumber[i]" *ngIf="bottomnumber[i]!==undefined && sumresult[i]=='-'" ></div>
                              
                              <div class = "leftovers" [innerHTML] = "leftovers2[i]" *ngIf="leftovers2[i]!==undefined"></div>  
                              <div class="digit plussign" *ngIf="!(sumresult[i]=='-')">+</div>  
                              <div class="multresults" >
                                <div *ngFor = "let mresult of mresults[i]; let t = index" id="{{'multresult'+t}}"class = "multresult"  >
                                  <div id= "{{'mresult'+t}}"[innerHTML] = "mresult"></div>
                                </div>
                                
                              </div>
                              <div class="padme">
                                
                                <div class="sumresult multresult" [innerHTML] ="sumresult[i]" *ngIf="sumresult[i]!='-'">
                                
                                </div>
                                <div class="clear"></div>
                              </div>
                            </div>
                  
                          </div>
                          <div class="operacao" id ="{{'operacao+i'}}" *ngIf = "resultados.length-1==i">
                            <div class="finalresult" [innerHTML]="resultado.html">

                            </div>

                          </div>
                            
                          
                        </div>
                        <div id="{{'resultado'+ i}}" class="explicacao collapse results__item__text">
                          <div [innerHTML]="resultado.explicacao"></div>
                        </div>
                      </li>
                  </div>
                
            </section>
            </div>
            <button class="btn btn-sucess" *ngIf="perfomedcalculus" (click)="toggle()">Mostrar/Esconder Passos</button>
            <div *ngIf="!showall">
                <div class="finalresult" [innerHTML] = "resultados[resultados.length-1]!= null?resultados[resultados.length-1].html :'' "></div>
            </div> 
            
        </div>
        <!-- endregion -->
    </div>
</section>
